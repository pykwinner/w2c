#local_costmap:
  global_frame:      odom_combined
  robot_base_frame:  base_footprint
  transform_tolerance: 1
  update_frequency:    10.0     #3
  publish_frequency:   8.0     #2
  rolling_window:      true
  width:               4.0
  height:              4.0
  resolution:          0.05

  plugins:
    - { name: static_layer,   type: "costmap_2d::StaticLayer" }
    - { name: obstacle_layer, type: "costmap_2d::ObstacleLayer" }
    - { name: inflation_layer, type: "costmap_2d::InflationLayer" }
    - { name: costmap_prohibition_layer,
        type: "costmap_prohibition_layer_namespace::CostmapProhibitionLayer" }

  # 专属局部膨胀层参数
  inflation_layer:
    enabled:             true    # 开启膨胀层
    cost_scaling_factor: 80      # 局部地图更“紧凑”或“宽松”的衰减80
    # 需 >= robot_radius(0.15)
    inflation_radius:    0.20
    #设置障碍层参数
  obstacle_layer:
    enabled: true
    combination_method: 1
    track_unknown_space: true
    obstacle_range: 2.5
    raytrace_range: 3.0
    observation_sources: scan
    scan:
      topic: scan_filtered
      data_type: LaserScan
      clearing: true
      marking: true

  #设置静态层参数
  static_layer:
    #是否开启静态层
    enabled: True
    #静态层的订阅的地图话题
    map_topic: map
    #地图话题中数据值为多少，会转换为静态层代价地图中的未知区域
    unknown_cost_value: -1
    #地图话题中数据值为多少，会转换为静态层代价地图中的完全占用区域
    lethal_cost_threshold: 100
    #是否仅把第一次订阅到的地图数据转换为静态层代价地图，无视后续订阅到的地图数据
    first_map_only: false
    #是否订阅话题 “map_topic”+“_updates”
    subscribe_to_updates: false
    #如果设置为false，地图话题中的未知区域在代价地图中会转换为自由区域
    track_unknown_space: False
    #如果设置为true，静态层代价地图只有未知、自由和完全占用三种情况
    #如果设置为false，静态层代价地图可以有不同的占用程度
    trinary_costmap: True
